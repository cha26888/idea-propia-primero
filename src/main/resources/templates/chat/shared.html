<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title th:text="${shared.title + ' · Chat compartido'}">Chat compartido</title>
  <link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/chat.css"><link rel="stylesheet" href="/css/study.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" integrity="sha384-WwGtaC6ywCHxA5cstpj/3+xIZvTez8dq2IcBQaXRkenHZ7FVVq1ZROtURwfbtTlG" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@17.0.5/lib/marked.umd.js"></script><script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js" integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE" crossorigin="anonymous"></script>
  <script defer src="/js/chat-format.js"></script><script defer src="/js/shared-chat.js"></script>
</head><body class="study-body"><main class="study-shell">
  <a href="/">IDEA PROPIA PRIMERO</a><h1 th:text="${shared.title}">Conversación</h1>
  <p>Copia compartida de solo lectura. No incluye mensajes posteriores a su creación. Las respuestas de IA pueden contener errores.</p><p class="study-muted">Creada (UTC): <span th:text="${shared.createdAt}"></span></p>
  <div class="shared-log"><article th:each="message : ${shared.messages}" class="msg" th:classappend="${message.role == 'user' ? 'msg--user' : 'msg--agent'}">
    <p class="msg__meta" th:text="${message.role == 'user' ? 'Estudiante' : 'Tutor'}"></p>
    <div class="msg__bubble" th:attr="data-shared-role=${message.role}" th:text="${message.content}"></div>
  </article></div>
</main><script src="/js/theme.js"></script></body></html>
