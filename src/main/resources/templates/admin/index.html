<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/ui :: head('Auxiliares')}"></head><body><main class="page"><section class="card card--wide" aria-labelledby="page-title"><a th:replace="~{fragments/ui :: brand}"></a><span class="badge">AUXILIARES</span><h1 class="title" id="page-title">Estudiantes registrados</h1><p th:if="${students.isEmpty()}">Aún no hay estudiantes registrados.</p><th:block th:unless="${students.isEmpty()}"><p th:text="${students.size() == 1 ? 'Hay 1 estudiante registrado.' : 'Hay ' + students.size() + ' estudiantes registrados.'}">Hay 0 estudiantes registrados.</p><div class="table-wrap" role="region" aria-labelledby="page-title" tabindex="0"><table class="table"><thead><tr><th scope="col">Usuario</th><th scope="col">Correo</th><th scope="col">Registro</th></tr></thead><tbody><tr th:each="student : ${students}"><td th:text="${student.username}">usuario</td><td th:text="${student.email}">correo@ejemplo.com</td><td><time th:datetime="${student.createdAt}" th:text="${#temporals.format(student.createdAt, 'dd/MM/yyyy')}">01/01/2026</time></td></tr></tbody></table></div></th:block><p><a th:href="@{/welcome}">Volver a mi cuenta</a></p><form th:replace="~{fragments/logout :: logout}"></form></section></main></body></html>>>>>>>> main
