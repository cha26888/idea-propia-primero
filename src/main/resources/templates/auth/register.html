<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/ui :: head('Crear cuenta')}"></head><body><main class="page"><section class="card" aria-labelledby="page-title"><a th:replace="~{fragments/ui :: brand}"></a><h1 class="title" id="page-title">Empieza con tu propia idea.</h1><p>Crea tu cuenta de estudiante.</p>
<form th:action="@{/register}" th:object="${form}" method="post" data-register th:attr="data-login-url=@{/login?registered},data-submit-url=@{/register/submit}" novalidate>
<div class="alert alert--error" role="alert" aria-live="assertive" tabindex="-1" data-form-alert th:hidden="${!#fields.hasErrors('*')}">
<span data-form-message>Revisa los campos indicados para crear tu cuenta.</span>
<p th:each="e : ${#fields.globalErrors()}" th:text="${e}" data-server-error></p></div>
<div th:replace="~{fragments/ui :: field('username','Usuario o apodo','text',${form.username},'username','3–30 letras sin tildes, números, puntos o guiones. Sin espacios.',${#fields.hasErrors('username') ? #fields.errors('username')[0] : ''})}"></div>
<div th:replace="~{fragments/ui :: field('email','Correo','email',${form.email},'email','También podrás usarlo para iniciar sesión.',${#fields.hasErrors('email') ? #fields.errors('email')[0] : ''})}"></div>
<div th:replace="~{fragments/ui :: password('new-password',|Mínimo ${passwordMin} caracteres. Sin requisitos de mayúsculas, números ni símbolos.|,${#fields.hasErrors('password') ? #fields.errors('password')[0] : ''})}"></div>
<button class="button button--primary button--block" type="submit" data-submit>Crear cuenta</button>
</form><p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p></section></main></body></html>
