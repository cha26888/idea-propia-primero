<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="|${title} · Idea propia primero|">Idea propia primero</title>
<link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/components.css}">
<script defer th:src="@{/js/auth.js}"></script></head><body>
<a th:fragment="brand" class="brand" th:href="@{/}">IDEA PROPIA PRIMERO</a>
<div th:fragment="field(id, label, type, value, autocomplete, help, error)" class="field">
<label class="field__label" th:for="${id}" th:text="${label}"></label>
<input class="input" th:id="${id}" th:name="${id}" th:type="${type}" th:value="${value}" th:autocomplete="${autocomplete}" required
 th:maxlength="${id == 'username' ? 30 : 254}" th:attr="aria-describedby=|${id}-help ${id}-error|,aria-invalid=${error != ''}">
<small class="field__help" th:id="|${id}-help|" th:text="${help}"></small>
<p class="field__error" th:id="|${id}-error|" th:attr="data-error-for=${id}" th:text="${error}"></p></div>
<div th:fragment="password(autocomplete, help, error)" class="field">
<label class="field__label" for="password">Contraseña</label><div class="password">
<input class="input" id="password" name="password" type="password" required th:autocomplete="${autocomplete}" aria-describedby="password-help password-error" th:attr="aria-invalid=${error != ''}">
<button class="button button--secondary" type="button" data-toggle-password aria-controls="password" aria-pressed="false">Mostrar</button></div>
<small class="field__help" id="password-help" th:text="${help}"></small>
<p class="field__error" id="password-error" data-error-for="password" th:text="${error}"></p></div>
<form th:fragment="logout" th:action="@{/logout}" method="post" class="stack"><button class="button button--secondary" type="submit">Cerrar sesión</button></form>
</body></html>
