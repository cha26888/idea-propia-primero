spring.application.name=idea-propia-primero
app.database.path=${APP_DATABASE_PATH:data/idea-propia-primero.db}
app.auth.password-min-length=${APP_PASSWORD_MIN_LENGTH:4}
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# Integración con NVIDIA NIM
ai.api-key=${NVIDIA_API_KEY:}
ai.endpoint=${AI_ENDPOINT:https://integrate.api.nvidia.com/v1/chat/completions}
ai.model=${AI_MODEL:nvidia/nemotron-3-super-120b-a12b}
ai.reasoning-effort=${AI_REASONING_EFFORT:none}
